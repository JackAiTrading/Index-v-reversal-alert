[project]
name = "minute-model-live"
version = "0.1.0"
description = "指数分钟模型左右侧观测台的页面数据生成脚本（scripts/build_live_data.py）"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6",
    # 模型工件（*_panel.joblib、LightGBM 文本模型）由 pandas 2.x / LightGBM 4.x 的训练环境产出，
    # 读取端锁定同一大版本，避免跨大版本反序列化失败或预测结果变化。
    "lightgbm>=4.7,<5",
    "numpy>=2.3,<3",
    "pandas>=2.3,<3",
]

[tool.uv]
# 本仓库是 Next.js 项目，Python 只用于生成页面数据，不需要把自身安装为包。
package = false
